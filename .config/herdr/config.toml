onboarding = false
[theme.custom]
panel_bg = "reset"

[keys]
close_pane="prefix+q"
copy_mode = "prefix+y"
detach = "prefix+d"
next_tab = ""
prefix = "ctrl+s"
previous_tab = ""
reload_config = "prefix+shift+r"
rename_tab = "prefix+r"
resize_mode = ""
settings = "prefix+shift+s"
split_horizontal = "prefix+s"
toggle_sidebar = "prefix+p"

[ui]
copy_on_select = true
pane_gaps = false
pane_borders = true
sidebar_collapsed_mode = "hidden"

[ui.toast.clipboard]
enabled = false

[ui.sidebar.agents]
rows = [
  ["state_icon", { token = "terminal_title_stripped", fg = "#cdd6f4", bold = true, dim = false }],
  [{ token = "workspace", fg = "#a6adc8", bold = false, dim = true }, "tab"],
]

[ui.toast]
delivery = "herdr"
